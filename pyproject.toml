[project]
name = "eyrie"
version = "0.1.0"
description = "A commanding place above your work — scaffold for planning across sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
eyrie = "eyrie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyrie"]

[dependency-groups]
dev = ["pytest>=8.0"]
